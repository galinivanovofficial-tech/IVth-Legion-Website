# Build the site image on every push to dev, smoke-test it, then push it to Artifact Registry.
# Logs in to Google Cloud with Workload Identity Federation: no stored keys.
name: build

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/project-aee592e9-ccea-48e5-bb0/web/legion-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          echo "TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          docker build -t legion-web:ci .

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 3000:3000 legion-web:ci
          for _ in $(seq 1 20); do
            curl -fs -o /dev/null http://127.0.0.1:3000/ && echo "site is up" && exit 0
            sleep 2
          done
          docker logs smoke
          exit 1

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/73551344435/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-ci@project-aee592e9-ccea-48e5-bb0.iam.gserviceaccount.com
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Push
        run: |
          docker tag legion-web:ci "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          echo "Pushed \`$IMAGE:$TAG\`" >> "$GITHUB_STEP_SUMMARY"